<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flexbox – Product Price UI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eaeded;
    color: #0f1111;
    padding: 24px;
  }

  /* FLEX #1: the card = image on the left, details on the right */
  .product {
    display: flex;
    gap: 24px;
    max-width: 820px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
  }

  .product-image {
    flex: 0 0 240px;            /* don't grow, don't shrink, 240px wide */
    display: flex;              /* FLEX #2: center the image box */
    align-items: center;
    justify-content: center;
    background: #f3f3f3;
    border-radius: 6px;
    font-size: 90px;
    min-height: 240px;
  }

  .product-details {
    flex: 1;                    /* take the remaining space */
    display: flex;
    flex-direction: column;     /* FLEX #3: stack details vertically */
    gap: 10px;
  }

  .title { font-size: 20px; line-height: 1.3; }

  /* FLEX #4: stars + review count on one row */
  .rating {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #007185;
  }
  .stars { color: #ffa41c; letter-spacing: 1px; }

  .deal-badge {
    align-self: flex-start;     /* don't stretch full width */
    background: #cc0c39;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 3px;
  }

  /* FLEX #5: price row, aligned on the text baseline */
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .discount { color: #cc0c39; font-size: 24px; }
  .price { font-size: 30px; }
  .price sup { font-size: 14px; position: relative; top: -0.4em; }
  .mrp { font-size: 14px; color: #565959; }
  .mrp s { color: #565959; }

  .delivery { font-size: 14px; }
  .delivery b { color: #007600; }

  /* FLEX #6: two buttons side by side, pushed to the bottom */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: auto;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-cart { background: #ffd814; }
  .btn-buy  { background: #ffa41c; }
  .btn:hover { filter: brightness(0.95); }
  .btn:focus-visible { outline: 3px solid #007185; outline-offset: 2px; }

  /* On small screens, stack image above details */
  @media (max-width: 600px) {
    .product { flex-direction: column; }
    .product-image { flex-basis: auto; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>

  <article class="product">
    <div class="product-image" aria-hidden="true">🎧</div>

    <div class="product-details">
      <h1 class="title">Wireless Noise Cancelling Headphones with 40-Hour Battery</h1>

      <div class="rating">
        <span class="stars">★★★★☆</span>
        <span>4.3</span>
        <span>(12,481 ratings)</span>
      </div>

      <span class="deal-badge">Limited time deal</span>

      <div class="price-row">
        <span class="discount">-35%</span>
        <span class="price"><sup>₹</sup>6,499</span>
        <span class="mrp">M.R.P.: <s>₹9,999</s></span>
      </div>

      <p class="delivery">FREE delivery <b>Tomorrow</b>. In stock.</p>

      <div class="actions">
        <button class="btn btn-cart">Add to cart</button>
        <button class="btn btn-buy">Buy now</button>
      </div>
    </div>
  </article>

</body>
</html>
